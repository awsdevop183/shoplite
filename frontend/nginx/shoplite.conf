# Nginx site for the ShopLite React build.
# Install: sudo cp shoplite.conf /etc/nginx/sites-available/shoplite
#          sudo ln -s /etc/nginx/sites-available/shoplite /etc/nginx/sites-enabled/
server {
    listen 80;
    server_name _;

    # Where `npm run build` output (dist/) is copied
    root /var/www/shoplite;
    index index.html;

    # Forward API calls to the backend over the VPC's private network.
    # Replace BACKEND_PRIVATE_IP with the backend EC2's private IPv4 (e.g. 172.31.11.109).
    # NO slash or path after :5000. With "http://IP:5000/" Nginx strips /api, the
    # backend receives /products instead of /api/products and answers 404.
    location /api/ {
        proxy_pass http://BACKEND_PRIVATE_IP:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    location / {
        # Serve the file if it exists, otherwise a real 404 (status code 404,
        # visible in DevTools, curl -i and the access log)
        try_files $uri $uri/ =404;
    }

    # Friendly page for 404s (copied from frontend/public/404.html by the build)
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # index.html must always be re-checked, so browsers pick up a new build
    # right after you redeploy (it points to the new hashed JS/CSS files)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Built JS/CSS file names contain a content hash, so they can be cached for long
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    access_log /var/log/nginx/shoplite.access.log;
    error_log  /var/log/nginx/shoplite.error.log;
}
