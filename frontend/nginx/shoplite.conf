# Nginx site for the ShopLite React build.
# Install: sudo cp shoplite.conf /etc/nginx/sites-available/shoplite
#          sudo ln -s /etc/nginx/sites-available/shoplite /etc/nginx/sites-enabled/
server {
    listen 80;
    server_name _;

    # Where `npm run build` output (dist/) is copied
    root /var/www/shoplite;
    index index.html;

    location / {
        # Single-page app: unknown paths fall back to index.html
        try_files $uri $uri/ /index.html;
    }

    # Built JS/CSS file names contain a content hash, so they can be cached for long
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/shoplite.access.log;
    error_log  /var/log/nginx/shoplite.error.log;
}
