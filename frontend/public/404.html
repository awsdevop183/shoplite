<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found · ShopLite</title>
  <style>
    :root { --text: #111827; --muted: #6b7280; --primary: #4f46e5; --primary-soft: #eef2ff; --bg: #f6f7f9; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      text-align: center;
    }
    .logo {
      width: 44px; height: 44px; margin: 0 auto 28px;
      border-radius: 10px; background: var(--primary); color: #fff;
      display: grid; place-items: center; font-weight: 700; font-size: 20px;
    }
    .code { font-size: 14px; font-weight: 600; color: var(--primary); letter-spacing: 0.08em; margin: 0 0 8px; }
    h1 { font-size: 32px; margin: 0 0 12px; }
    p { color: var(--muted); margin: 0 0 28px; line-height: 1.5; }
    a {
      display: inline-block; padding: 10px 18px; border-radius: 8px;
      background: var(--primary); color: #fff; text-decoration: none; font-weight: 500;
    }
    a:hover { background: #4338ca; }
    code { background: var(--primary-soft); color: var(--primary); padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="logo">S</div>
    <p class="code">404 ERROR</p>
    <h1>Page not found</h1>
    <p>Sorry, we couldn't find <code id="path">this page</code>.<br />It may have been moved or never existed.</p>
    <a href="/">Back to products</a>
  </main>
  <script>document.getElementById('path').textContent = location.pathname;</script>
</body>
</html>
